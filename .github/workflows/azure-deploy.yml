name: Azure CDN & Low-Cost Container Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP || 'rg-simple-ai-prod' }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME || 'ca-simple-ai-backend-prod' }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
  FRONTEND_URL: "https://icy-bay-0cfcf190f.4.azurestaticapps.net"

jobs:
  # ============================================================================
  # 1. Backend Tests & Lint
  # ============================================================================
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Validate Backend Import
        env:
          APP_ENV: testing
          GEMINI_API_KEY: "test-key-for-ci"
          DATABASE_URL: "sqlite:///:memory:"
          VECTOR_DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "test-secret-key-32bytes-for-ci-testing"
        run: |
          uv run python -c "import simple_ai; print('Backend loaded OK')"

  # ============================================================================
  # 2. Frontend Typecheck & Build Validation
  # ============================================================================
  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Next.js Build
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
          BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
        run: npm run build

  # ============================================================================
  # 3. Build & Push Backend Container to Azure Container Registry
  # ============================================================================
  build-and-push-backend:
    name: Build & Push Backend Container
    needs: [test-backend, test-frontend]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ steps.image_info.outputs.full_image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Store Image Info
        id: image_info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend:sha-${SHORT_SHA}"
          echo "full_image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Image built: $IMAGE"

  # ============================================================================
  # 4. Deploy Backend to Azure Container Apps (Scale-to-Zero, Low Cost)
  # ============================================================================
  deploy-backend-container:
    name: Deploy Backend to Azure Container App
    needs: build-and-push-backend
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container Revision (Scale-to-Zero, 0.25 CPU / 0.5Gi)
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TARGET_IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend:sha-${SHORT_SHA}"
          echo "Deploying image: ${TARGET_IMAGE}"

          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${TARGET_IMAGE}" \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.25 \
            --memory 0.5Gi \
            --set-env-vars \
              "APP_ENV=production" \
              "PORT=8000" \
              "DEBUG=False" \
              "LOG_LEVEL=WARNING" \
              "CORS_ORIGINS=${{ env.FRONTEND_URL }},*" \
              "FRONTEND_URL=${{ env.FRONTEND_URL }}" \
              "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
              "JWT_ALGORITHM=HS256" \
              "ACCESS_TOKEN_EXPIRE_MINUTES=360" \
              "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              "BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/" \
              "MODEL=gemini-2.5-flash" \
              "EMBEDDING_MODEL=gemini-embedding-001" \
              "EMBEDDING_DIM=768" \
              "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
              "VECTOR_DATABASE_URL=${{ secrets.VECTOR_DATABASE_URL }}" \
              "DB_POOL_SIZE=10" \
              "DB_MAX_OVERFLOW=20" \
              "CHUNK_SIZE=800" \
              "CHUNK_OVERLAP=150" \
              "ENFORCE_HTTPS=False" \
              "HSTS_ENABLED=True"

      - name: Verify Backend Health
        id: health_check
        run: |
          BACKEND_URL=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend deployed: https://${BACKEND_URL}"
          echo "backend_url=https://${BACKEND_URL}" >> $GITHUB_OUTPUT

          for i in {1..9}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://${BACKEND_URL}/" || echo "000")
            echo "Health check attempt $i - HTTP $HTTP_CODE"
            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" || "$HTTP_CODE" == "422" ]]; then
              echo "Backend is healthy!"
              break
            fi
            sleep 10
          done

  # ============================================================================
  # 5. Deploy Frontend to Azure CDN (Azure Static Web Apps)
  # ============================================================================
  deploy-frontend-cdn:
    name: Deploy Frontend to Azure CDN (Static Web App)
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend for Azure Static Web Apps
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
          BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
          NEXT_OUTPUT_STANDALONE: "false"
        run: npm run build

      - name: Deploy to Azure Static Web Apps (Global CDN)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: ".next"
          skip_app_build: true
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Close PR Preview Environment
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

  # ============================================================================
  # 6. Daily Compute Usage Monitoring Report
  # ============================================================================
  daily-usage-report:
    name: Daily Compute & Cost Monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fetch Container App Metrics (Last 24h)
        run: |
          END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          START_TIME=$(date -u -d "24 hours ago" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || \
                       date -u -v -24H +"%Y-%m-%dT%H:%M:%SZ")

          RESOURCE_ID=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query id -o tsv)

          echo ""
          echo "========================================================"
          echo "  Daily Compute Usage Report - $(date -u '+%Y-%m-%d')"
          echo "========================================================"

          az monitor metrics list \
            --resource "$RESOURCE_ID" \
            --metric "Replicas" \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --interval PT1H \
            --aggregation Average Maximum \
            --output table 2>/dev/null || echo "Metrics not available (no traffic yet)"

          echo ""
          echo "--- Active Revisions ---"
          az containerapp revision list \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.active].{Revision:name, State:properties.runningState, Replicas:properties.replicas, Health:properties.healthState}" \
            --output table

          echo ""
          echo "--- Cost Budget Status ---"
          az consumption budget list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[].{Name:name, Budget:properties.amount, TimeGrain:properties.timeGrain}" \
            --output table 2>/dev/null || echo "Budget info requires Billing Reader role"

          echo "========================================================"
