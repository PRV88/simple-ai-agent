name: Azure CDN & Low-Cost Container Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP || 'rg-simple-ai-prod' }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME || 'ca-simple-ai-backend-prod' }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  # ============================================================================
  # 1. Validation & Quality Gates
  # ============================================================================
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Validate Python Package Integrity
        env:
          APP_ENV: testing
          GEMINI_API_KEY: "test-gemini-api-key-for-ci"
          DATABASE_URL: "sqlite:///:memory:"
          VECTOR_DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "test-secret-key-32bytes-for-ci-testing"
        run: |
          uv run python -c "import simple_ai; print('Backend loaded successfully')"

  test-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Next.js Build
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ============================================================================
  # 2. Build & Push Backend Container to Azure Container Registry (ACR)
  # ============================================================================
  build-and-push-backend:
    name: Build & Push Backend Container
    needs: [test-backend, test-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ steps.image_info.outputs.full_image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Store Image Info
        id: image_info
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend:${{ steps.meta.outputs.version }}"
          echo "full_image=$IMAGE" >> $GITHUB_OUTPUT

  # ============================================================================
  # 3. Deploy Backend to Azure Container Apps (Scale-to-Zero, Low Cost)
  # ============================================================================
  deploy-backend-container:
    name: Deploy to Azure Container App (Serverless)
    needs: build-and-push-backend
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container Revision with Strict Low-Cost Scaling Limits
        run: |
          IMAGE_TAG="${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend:sha-${{ github.sha }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TARGET_IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/simple-ai-backend:sha-${SHORT_SHA}"

          echo "Updating Container App ${{ env.CONTAINER_APP_NAME }} with image: ${TARGET_IMAGE}"

          # Deploy revision while enforcing scale-to-zero (min: 0, max: 2) and minimal CPU/Memory
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${TARGET_IMAGE}" \
            --min-replicas 0 \
            --max-replicas 2 \
            --cpu 0.25 \
            --memory 0.5Gi

      - name: Get Backend Ingress URL
        id: get_url
        run: |
          BACKEND_URL=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend URL: https://${BACKEND_URL}"
          echo "backend_url=https://${BACKEND_URL}" >> $GITHUB_OUTPUT

  # ============================================================================
  # 4. Deploy Frontend to Azure CDN (Azure Static Web Apps)
  # ============================================================================
  deploy-frontend-cdn:
    name: Deploy Frontend to Azure CDN (Static Web App)
    needs: [test-backend, test-frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure Static Web Apps (Integrated Azure CDN)
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          api_location: ""
          output_location: ""
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          BACKEND_URL: "https://ca-simple-ai-backend-prod.victorioustree-88471946.eastus.azurecontainerapps.io"
