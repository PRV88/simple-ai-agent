version: '3.8'

services:
  postgres-dev:
    image: pgvector/pgvector:pg16
    container_name: simple_ai_pgvector_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_ai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simple_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_dev_data:
